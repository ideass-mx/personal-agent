# Windows Installer — GitHub Actions (CI packaging)
#
# Compiles PersonalAgent-Setup.exe on windows-latest.
# Does NOT perform real Windows field installation validation.
#
name: Windows Installer

on:
  workflow_dispatch:
  # Optional version-tag builds (artifact only — no GitHub Release).
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Package + Inno Setup
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # Packaging embeds portable Windows runtimes (PHASE 51).
      FETCH_NODE_WIN: "1"
      FETCH_ELECTRON_WIN: "1"
      REQUIRE_WINDOWS_RUNTIMES: "1"
      # Must match a real GitHub Electron release asset: electron-<tag>-win32-x64.zip
      # (NOT win-x64 — that 404s). Do not pin unpublished Electron tags.
      ELECTRON_WIN_VERSION: "v33.4.11"
      # Dummy values so hub config can load during smoke only — not production secrets.
      # Never echo these in logs.
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder-not-a-real-key"
      HUB_TOKEN: "ci-hub-token-placeholder-do-not-use-prod"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            gateway/package-lock.json
            node/package-lock.json
            web/package-lock.json
            packages/protocol/package-lock.json
            packages/workspace-http/package-lock.json

      - name: Diagnostics (pre) + Electron URL preflight
        shell: pwsh
        run: |
          Write-Host "node: $(node -v)"
          Write-Host "npm: $(npm -v)"
          Write-Host "commit: $($env:GITHUB_SHA)"
          Write-Host "ref: $($env:GITHUB_REF)"
          Write-Host "runner: $($env:RUNNER_OS) $($env:RUNNER_ARCH)"
          Write-Host "FETCH_NODE_WIN=$env:FETCH_NODE_WIN FETCH_ELECTRON_WIN=$env:FETCH_ELECTRON_WIN"
          Write-Host "ELECTRON_WIN_VERSION=$env:ELECTRON_WIN_VERSION"

          $script = Get-Content -Raw "scripts/package-windows.mjs"
          if ($script -match 'electron-\$\{version\}-win-x64\.zip') {
            throw "STALE SCRIPT: package-windows.mjs still uses win-x64 (must be win32-x64). Wrong commit checked out?"
          }
          if ($script -notmatch 'win32-x64') {
            throw "STALE SCRIPT: package-windows.mjs missing win32-x64. Wrong commit checked out?"
          }
          if ($script -match 'ELECTRON_WIN_VERSION \|\| "v33\.2\.1"') {
            throw "STALE SCRIPT: package-windows.mjs still defaults to an unpublished Electron tag. Wrong commit checked out?"
          }

          $ver = $env:ELECTRON_WIN_VERSION
          $url = "https://github.com/electron/electron/releases/download/$ver/electron-$ver-win32-x64.zip"
          Write-Host "ELECTRON_ASSET_URL=$url"

          $resp = Invoke-WebRequest -Method Head -Uri $url -MaximumRedirection 5 -UseBasicParsing
          Write-Host "ELECTRON_ASSET_HEAD_STATUS=$($resp.StatusCode)"
          if ($resp.StatusCode -lt 200 -or $resp.StatusCode -ge 400) {
            throw "Electron asset HEAD failed: $($resp.StatusCode) for $url"
          }

      # PHASE 64.2: workspace-http npm ci removed (not on Windows installer release path).
      # Keep gateway npm ci on windows-latest for better-sqlite3 PE natives.
      - name: Install dependencies (npm ci)
        shell: pwsh
        run: |
          function Invoke-NpmCiTimed {
            param(
              [Parameter(Mandatory = $true)][string]$Label,
              [Parameter(Mandatory = $true)][string]$Prefix
            )
            Write-Host "[windows-installer] npm ci $Label START"
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            npm ci --prefix $Prefix
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $sw.Stop()
            $elapsed = $sw.Elapsed.ToString("hh\:mm\:ss")
            Write-Host "[windows-installer] npm ci $Label END: $elapsed"
            Write-Host "[windows-installer] $Label npm ci duration: $($sw.Elapsed)"
          }

          Invoke-NpmCiTimed -Label "protocol" -Prefix "packages/protocol"
          Invoke-NpmCiTimed -Label "gateway" -Prefix "gateway"
          Invoke-NpmCiTimed -Label "node" -Prefix "node"
          Invoke-NpmCiTimed -Label "web" -Prefix "web"

      - name: Package Windows layout
        shell: pwsh
        run: npm run package:windows

      - name: Diagnostics (package layout)
        shell: pwsh
        run: |
          $root = "dist/windows/PersonalAgent"
          if (-not (Test-Path $root)) { throw "Missing $root" }
          Write-Host "layout: $root"
          $node = "$root/runtime/node/node.exe"
          $electron = "$root/runtime/electron/electron.exe"
          Write-Host "node.exe: $(Test-Path $node)"
          Write-Host "electron.exe: $(Test-Path $electron)"
          if (Test-Path $node) {
            $nb = (Get-Item $node).Length
            Write-Host "node.exe_bytes=$nb"
            if ($nb -lt 1000000) { throw "node.exe too small ($nb bytes)" }
          } else {
            throw "Missing $node after package:windows"
          }
          if (Test-Path $electron) {
            $eb = (Get-Item $electron).Length
            Write-Host "electron.exe_bytes=$eb"
            if ($eb -lt 1000000) { throw "electron.exe too small ($eb bytes)" }
          } else {
            throw "Missing $electron after package:windows"
          }
          if (Test-Path "$root/runtime/node/node-win.zip") {
            throw "Leftover node-win.zip must not ship (delete after extract)"
          }
          if (Test-Path "$root/runtime/electron/electron-win.zip") {
            throw "Leftover electron-win.zip must not ship (delete after extract)"
          }
          Write-Host "console: $(Test-Path "$root/console/index.html")"
          Write-Host "gateway_cjs: $(Test-Path "$root/gateway/gateway.cjs")"
          Write-Host "gateway_hub_alias: $(Test-Path "$root/gateway/hub.cjs")"
          Write-Host "node_cjs: $(Test-Path "$root/node/node.cjs")"
          Write-Host "agent_alias: $(Test-Path "$root/agent/agent.cjs")"
          Write-Host "launcher: $(Test-Path "$root/AgentePersonal.bat")"
          Get-ChildItem "$root/runtime/node" | Select-Object Name, Length | Format-Table -AutoSize
          Get-ChildItem $root | Select-Object Name, Mode | Format-Table -AutoSize

      - name: Validate Windows package (strict runtimes + native PE)
        shell: pwsh
        run: npm run validate:windows-package

      - name: PHASE 64.1 native modules gate (explicit before Inno)
        shell: pwsh
        run: |
          node --input-type=module -e "import { assertWindowsNativeModules } from './scripts/windows-native-modules.mjs'; assertWindowsNativeModules('dist/windows/PersonalAgent');"

      - name: PHASE 51 architecture tests
        working-directory: gateway
        shell: pwsh
        run: npx tsx --test tests/architecture/phase51-windows-installer-and-console-integration.test.ts

      - name: Smoke package (compatible)
        shell: pwsh
        run: npm run smoke:package
        # Uses placeholder env above; does not print secrets.

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          Write-Host "ISCC=$iscc"
          cmd /c "`"$iscc`" /?" | Select-Object -First 5
          exit 0

      - name: Compile PersonalAgent-Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          $iss = Join-Path $pwd "installer\windows\personal-agent.iss"
          if (-not (Test-Path $iss)) { throw "Missing $iss" }
          $gen = Join-Path $pwd "installer\windows\version.generated.iss"
          if (-not (Test-Path $gen)) { throw "Missing $gen (package:windows must write version.generated.iss)" }
          Get-Content $gen | Write-Host
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }

      - name: Finalize installer (SHA-256 + build metadata)
        id: finalize
        shell: pwsh
        run: |
          node scripts/release/finalize-installer.mjs
          if ($LASTEXITCODE -ne 0) { throw "finalize-installer failed" }
          $info = Get-Content "dist/windows/PersonalAgent/build-info.json" -Raw | ConvertFrom-Json
          $name = "PersonalAgent-Setup-$($info.version)$(if ($info.channel -eq 'release') { '' } else { "-dev.$($info.build)" })-win-x64.exe"
          # Prefer exact path from finalize via glob
          $exe = Get-ChildItem "dist/windows/PersonalAgent-Setup-*-win-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Versioned Setup.exe not found under dist/windows" }
          $sha = "$($exe.FullName).sha256"
          if (-not (Test-Path $sha)) { throw "Missing $($exe.Name).sha256" }
          $size = $exe.Length
          Write-Host "setup_path=$($exe.FullName)"
          Write-Host "setup_size_bytes=$size"
          Write-Host "setup_version=$($info.version) build=$($info.build) channel=$($info.channel)"
          if ($size -lt 40000000) {
            throw "Setup.exe too small to contain embedded runtimes ($size bytes; need >= 40MB)"
          }
          Get-ChildItem "dist/windows" | Select-Object Name, Length | Format-Table -AutoSize
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "channel=$($info.channel)" >> $env:GITHUB_OUTPUT
          "artifact_name=PersonalAgent-Setup-$($info.version)-$($info.channel)-win-x64" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.finalize.outputs.artifact_name }}
          path: |
            dist/windows/PersonalAgent-Setup-*-win-x64.exe
            dist/windows/PersonalAgent-Setup-*-win-x64.exe.sha256
            dist/windows/PersonalAgent-Setup-*-win-x64.exe.build-info.json
          if-no-files-found: error
          retention-days: 30
